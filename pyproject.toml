[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "metamk"
version = "0.1.0"
description = "A tiny library that divides test code into PREPARE / MAIN / VERIFY phases and records the failed phase on the exception."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "minoru_jp" }]
dependencies = []

keywords = [
  "test",
  "testing",
  "pytest",
  "traceback",
  "exception",
  "phase",
  "structuring",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
lint = ["ruff==0.16.10"]
typecheck = ["basedpyright==1.40.2"]
docs = ["shikumi-devdoc>=0.3.5"]
dist = ["build>=1.2", "twine>=6.1"]

[project.urls]
Repository = "https://github.com/minoru-jp/metamk"
Changelog = "https://github.com/minoru-jp/metamk/blob/main/CHANGELOG.md"
Issues = "https://github.com/minoru-jp/metamk/issues"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Ruff is version-pinned; keep that version's stable default rule set as the
# baseline rather than silently opting into preview diagnostics.
preview = false

[tool.hatch.build.targets.wheel]
packages = ["src/metamk"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github"]

[tool.basedpyright]
include = ["src/metamk"]
pythonVersion = "3.11"
